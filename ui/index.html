<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NewAl">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>NewAl Mobile</title>
<style>
:root {
  --bg: #0e0f12; --panel: #16181d; --raised: #1f2229; --line: #2a2e37;
  --text: #e4e6eb; --muted: #858c99; --dim: #5c6370; --accent: #d9825b; --blue: #7aa2ff;
  --ok: #6bcf8e; --warn: #e8b25a; --bad: #ff7a7a; --user: #1b2235;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, "Noto Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
button { -webkit-tap-highlight-color: transparent; font: inherit; color: var(--text); background: var(--raised);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; min-height: 40px; cursor: pointer; }
button.primary { background: var(--accent); color: #1a0f08; border-color: transparent; font-weight: 600; }
button.danger { color: var(--bad); }
button.ghost { background: none; border-color: transparent; }
button:disabled { opacity: .45; cursor: default; }

header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel);
  border-bottom: 1px solid var(--line); }
header h1 { font: 600 15px/1.2 var(--mono); margin: 0; flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
header h1 .star { color: var(--accent); }
#status { font: 12px var(--mono); color: var(--muted); }
.warn { font-size: 12px; color: var(--warn); padding: 4px 12px; border-bottom: 1px solid var(--line); }

#todoPanel { background: var(--panel); border-bottom: 1px solid var(--line); padding: 6px 12px;
  font: 13px/1.5 var(--mono); max-height: 30vh; overflow-y: auto; }
#todoPanel[hidden] { display: none; }
#todoPanel .t-head { color: var(--muted); display: flex; justify-content: space-between; cursor: pointer; }
.todo { display: flex; gap: 8px; }
.todo.completed { color: var(--dim); text-decoration: line-through; }
.todo.in_progress { color: var(--accent); font-weight: 600; }

main { flex: 1; overflow-y: auto; padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 8px;
  overscroll-behavior: contain; }
.msg { white-space: pre-wrap; word-break: break-word; }
.msg.user { background: var(--user); border-radius: 10px; padding: 8px 10px; font-family: var(--mono);
  font-size: 14px; border-inline-start: 3px solid var(--blue); }
.msg.user::before { content: "> "; color: var(--blue); }
.msg.assistant { padding: 2px 2px; display: flex; gap: 8px; white-space: normal; }
.msg.assistant::before { content: "●"; color: var(--text); flex: none; }
.msg.assistant .md { flex: 1; min-width: 0; }
.msg.note { color: var(--muted); }
.msg.error { color: var(--bad); background: #221416; border: 1px solid #4a2a2d; border-radius: 10px; padding: 8px 10px; }
.msg.muted { color: var(--muted); font-size: 13px; font-family: var(--mono); }
.md p { margin: 0 0 .55em; white-space: pre-wrap; }
.md p:last-child { margin-bottom: 0; }
.md h3 { font-size: 15px; margin: .6em 0 .3em; }
.md ul { margin: .2em 0 .55em; padding-inline-start: 1.3em; }
.md code { font-family: var(--mono); font-size: 13px; background: var(--raised); padding: 1px 5px; border-radius: 5px; }
.codeblock { position: relative; margin: .4em 0 .6em; }
.codeblock pre { background: #08090b; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 0;
  overflow-x: auto; white-space: pre; font: 12.5px/1.5 var(--mono); direction: ltr; text-align: left; }
.codeblock .copy { position: absolute; top: 4px; inset-inline-end: 4px; min-height: 30px; padding: 2px 8px; font-size: 12px; }

.tool { font: 13px/1.5 var(--mono); }
.tool .head { display: flex; gap: 6px; align-items: baseline; word-break: break-all; }
.tool .dot { color: var(--ok); }
.tool.fail .dot { color: var(--bad); }
.tool .name { font-weight: 700; }
.tool .arg { color: var(--muted); }
.tool .sub { color: var(--muted); padding-inline-start: 14px; word-break: break-word; }
.tool .sub::before { content: "⎿ "; color: var(--dim); }
.tool .row { margin-top: 4px; padding-inline-start: 14px; justify-content: flex-start; }
.badge { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; color: var(--ok); }

.card { background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.card .title { font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 8px; }
pre.box { background: #08090b; border-radius: 8px; padding: 8px; max-height: 55vh; overflow: auto; white-space: pre;
  font: 12.5px/1.5 var(--mono); margin: 6px 0 0; direction: ltr; text-align: left; }
.add { color: var(--ok); } .del { color: var(--bad); } .hunk { color: var(--blue); } .sub { color: var(--muted); }

#spinner { font: 13px var(--mono); color: var(--accent); display: flex; gap: 8px; align-items: center; }
#spinner[hidden] { display: none; }
#spinner .glyph { display: inline-block; animation: spin 1.2s linear infinite; }
#spinner .hint { color: var(--dim); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #spinner .glyph { animation: none; } }

footer { background: var(--panel); border-top: 1px solid var(--line); padding: 6px 8px 8px; position: relative; }
#slashMenu { position: absolute; bottom: 100%; left: 8px; right: 8px; background: var(--raised); border: 1px solid var(--line);
  border-radius: 10px; padding: 4px; font: 13px var(--mono); max-height: 40vh; overflow-y: auto; }
#slashMenu[hidden] { display: none; }
#slashMenu button { display: flex; width: 100%; justify-content: space-between; gap: 10px; background: none; border: 0;
  min-height: 38px; text-align: start; }
#slashMenu button span:last-child { color: var(--muted); }
form { display: flex; gap: 6px; align-items: flex-end; }
textarea, input { font: inherit; color: var(--text); background: #0a0b0d; border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 10px; }
textarea { flex: 1; resize: none; min-height: 42px; max-height: 160px; font-family: var(--mono); font-size: 14px; }
textarea:focus, input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
input { width: 100%; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px;
  font: 12px var(--mono); color: var(--muted); }
#btnMode { min-height: 30px; padding: 2px 10px; font: 12px var(--mono); }
#btnMode.auto { color: var(--accent); border-color: var(--accent); }
#stop[hidden], #send[hidden] { display: none; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px;
  width: min(96vw, 720px); max-height: 90vh; padding: 14px; }
dialog::backdrop { background: rgba(0, 0, 0, .65); }
.list-item { display: block; width: 100%; text-align: start; margin: 4px 0; padding: 8px 10px; min-height: 44px; }
.list-item .meta { display: block; color: var(--muted); font: 12px var(--mono); }
.list-item.current { border-color: var(--accent); }
.tree-item { -webkit-tap-highlight-color: transparent; display: block; width: 100%; text-align: start; border: 0; background: none;
  padding: 6px 4px; min-height: 36px; border-radius: 8px; font-family: var(--mono); font-size: 13px; }
.tree-item.dir { color: var(--blue); }
.err-text { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<header>
  <button id="btnSessions" class="ghost" type="button" aria-label="Sessions">☰</button>
  <h1 id="title"><span class="star">✻</span> NewAl</h1>
  <span id="status"></span>
  <button id="btnFiles" type="button">Files</button>
</header>
<div class="warn">Free model routes may keep your prompts. Do not paste secrets or private data.</div>
<div id="todoPanel" hidden></div>
<main id="log" aria-live="polite"></main>
<footer>
  <div id="slashMenu" hidden></div>
  <div class="bar">
    <button id="btnMode" type="button" title="Tap to switch how edits are applied">⏸ ask before edits</button>
    <span id="hint">/ for commands</span>
  </div>
  <form id="composer">
    <textarea id="goal" rows="1" dir="auto" placeholder="Ask, or describe a change…" enterkeyhint="send"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
    <button class="danger" id="stop" type="button" hidden>Stop</button>
  </form>
</footer>

<dialog id="gate">
  <h2 style="margin-top:0">Connect</h2>
  <p>Paste the access token from the file the server printed (its path is shown in Termux).</p>
  <input id="tokenInput" type="password" autocomplete="off" spellcheck="false">
  <div class="row"><button class="primary" id="saveToken" type="button">Connect</button></div>
  <p id="gateError" class="err-text"></p>
</dialog>

<dialog id="filesDlg">
  <div class="row" style="margin-top:0"><strong>Workspace</strong><button id="closeFiles" type="button">Close</button></div>
  <div id="tree"></div>
</dialog>

<dialog id="viewerDlg">
  <div class="row" style="margin-top:0"><strong id="viewerTitle"></strong><button id="closeViewer" type="button">Close</button></div>
  <pre id="viewerBody" class="box"></pre>
</dialog>

<dialog id="diffDlg">
  <div class="row" style="margin-top:0"><strong id="diffTitle"></strong><button id="closeDiff" type="button">Close</button></div>
  <pre id="diffBody" class="box"></pre>
  <div class="row" id="diffActions"></div>
</dialog>

<dialog id="sessionsDlg">
  <div class="row" style="margin-top:0"><strong>Sessions</strong>
    <span><button id="newSession" class="primary" type="button">New</button> <button id="closeSessions" type="button">Close</button></span></div>
  <div id="sessionList"></div>
</dialog>

<dialog id="changesDlg">
  <div class="row" style="margin-top:0"><strong>Changes</strong><button id="closeChanges" type="button">Close</button></div>
  <div id="changeList"></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
