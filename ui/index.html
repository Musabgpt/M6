<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NewAl">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>NewAl Mobile</title>
<style>
:root {
  --bg: #14161a; --panel: #1c1f25; --raised: #262a33; --line: #2a2e36;
  --text: #e6e8ec; --muted: #8b93a1; --accent: #7aa2ff; --ok: #5fd38a;
  --warn: #f0b35a; --bad: #ff7a7a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
header { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; flex: 1; }
button { -webkit-tap-highlight-color: transparent; font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
button.primary { background: var(--accent); color: #0b1020; border-color: transparent; font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
#status { font-size: 12px; color: var(--muted); }
.warn { font-size: 12px; color: var(--warn); padding: 6px 12px; border-bottom: 1px solid var(--line); }
main { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: #243152; }
.msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.msg.error { align-self: stretch; color: var(--bad); background: #241617; border: 1px solid #4a2a2a; }
.msg.muted { align-self: flex-start; color: var(--muted); font-size: 13px; }
.card { align-self: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; font-size: 14px; }
.card .sub { color: var(--muted); font-size: 13px; word-break: break-word; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 8px; }
pre, code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
pre.box { background: #0f1115; border-radius: 8px; padding: 8px; max-height: 55vh; overflow: auto; white-space: pre; }
.add { color: var(--ok); } .del { color: var(--bad); } .hunk { color: var(--accent); }
form { display: flex; gap: 8px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); }
textarea, input { font: inherit; color: var(--text); background: #101216; border: 1px solid var(--line);
  border-radius: 12px; padding: 10px; }
textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; }
input { width: 100%; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px;
  width: min(96vw, 720px); max-height: 90vh; padding: 14px; }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
.tree-item { -webkit-tap-highlight-color: transparent; display: block; width: 100%; text-align: start; border: 0; background: none; padding: 6px 4px;
  min-height: 36px; border-radius: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.tree-item.dir { color: var(--accent); }
.err-text { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<header>
  <button id="btnFiles" type="button">Files</button>
  <h1>NewAl Mobile</h1>
  <span id="status"></span>
</header>
<div class="warn">Free model routes may keep your prompts. Do not paste secrets or private data.</div>
<main id="log" aria-live="polite"></main>
<form id="composer">
  <textarea id="goal" rows="1" placeholder="Describe a change or ask"></textarea>
  <button class="primary" id="send" type="submit">Send</button>
</form>

<dialog id="gate">
  <h2 style="margin-top:0">Connect</h2>
  <p>Paste the access token from the file the server printed (its path is shown in Termux).</p>
  <input id="tokenInput" type="password" autocomplete="off" spellcheck="false">
  <div class="row"><button class="primary" id="saveToken" type="button">Connect</button></div>
  <p id="gateError" class="err-text"></p>
</dialog>

<dialog id="filesDlg">
  <div class="row" style="margin-top:0"><strong>Workspace</strong><button id="closeFiles" type="button">Close</button></div>
  <div id="tree"></div>
</dialog>

<dialog id="viewerDlg">
  <div class="row" style="margin-top:0"><strong id="viewerTitle"></strong><button id="closeViewer" type="button">Close</button></div>
  <pre id="viewerBody" class="box"></pre>
</dialog>

<dialog id="diffDlg">
  <div class="row" style="margin-top:0"><strong id="diffTitle"></strong><button id="closeDiff" type="button">Close</button></div>
  <pre id="diffBody" class="box"></pre>
  <div class="row" id="diffActions"></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
