plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.musab.m6'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.musab.m6'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*']
        }
    }
}
