plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'ai.musab.m6'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.musab.m6'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
        ndk {
            // Phones are arm64; x86_64 lets the APK run in the Android emulator too.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*']
        }
    }
}

chaquopy {
    defaultConfig {
        version '3.12'
    }
}
